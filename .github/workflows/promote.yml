name: Generer un article Mangools

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Executer l'agent
        env:
          MANGOOLS_AFFILIATE_LINK: ${{ secrets.MANGOOLS_AFFILIATE_LINK }}
        run: python agent.py
      - name: Commit et Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Nouvel article genere automatiquement" || echo "Aucun changement"
          git push
